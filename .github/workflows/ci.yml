name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m pip install python-docx python-pptx openpyxl pypdf
      - run: python tests/independent_readers.py
      - run: npm run native:sync
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium --only-shell
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm run test:e2e:latex
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
